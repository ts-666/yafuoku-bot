name: Yafuoku Monitor

on:
  schedule:
    # 5分ごとに定期実行
    - cron: '*/5 * * * *'
  workflow_dispatch: # 手動実行ボタンを有効化

concurrency:
  # 前回の実行が終わる前に次のスケジュールが走ると seen_ids.txt の push が
  # 衝突するため、同時実行を1つに制限する（実行中のジョブはキャンセルしない）
  group: yafuoku-monitor
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4 google-generativeai python-dotenv

      - name: Ensure seen_ids.txt exists
        run: touch seen_ids.txt

      - name: Run Scraper & Assessment Bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python main.py

      - name: Commit & Push seen_ids.txt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_ids.txt
          if ! git diff --staged --quiet; then
            git commit -m "chore: update seen_ids [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          else
            echo "No changes to commit."
          fi
