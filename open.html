<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ヤフオクアプリを開く</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  window.onload = function() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    if (id) {
      // ヤフオクアプリを即座に強制起動
      window.location.href = "yjauction://auction?id=" + id;
      // 万が一アプリがない場合のWebフォールバック
      setTimeout(function() {
        window.location.href = "https://page.auctions.yahoo.co.jp/jp/auction/" + id;
      }, 1500);
    }
  }
</script>
<style>
  body { font-family: -apple-system, sans-serif; text-align: center; padding-top: 50px; background-color: #f5f5f7; }
  .btn { display: inline-block; padding: 15px 30px; background-color: #ff0033; color: #fff; font-weight: bold; text-decoration: none; border-radius: 8px; font-size: 18px; }
</style>
</head>
<body>
  <h2>ヤフオクアプリを起動中...</h2>
  <p>自動で開かない場合は下のボタンを押してください</p>
  <br>
  <script>
    const p = new URLSearchParams(window.location.search);
    const aid = p.get('id');
    if (aid) {
      document.write('<a class="btn" href="yjauction://auction?id=' + aid + '">ヤフオクアプリで開く</a>');
    }
  </script>
</body>
</html>
